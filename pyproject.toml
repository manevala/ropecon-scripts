[project]
name = "ropecon-scripts"
version = "0.1.0"
description = "Scripts for Ropecon/Kompassi ATK stuff"
authors = [
    {name = "Maija Nevala"}
]
readme = "README.md"
requires-python = ">=3.13"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
gql = {extras = ["all"], version = "^4.0.0"}
python-dotenv = "^1.2.2"
requests = "^2.34.2"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"

[tool.poetry.group.dev]
optional = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
